name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            target: x86_64-pc-windows-msvc
            binary-name: tailorbird.exe
          - os: macos-latest
            os-name: macOS (Universal 2)
            target: aarch64-apple-darwin
            binary-name: tailorbird
          - os: ubuntu-22.04
            os-name: Linux (Ubuntu x86_64)
            target: x86_64-unknown-linux-gnu
            binary-name: tailorbird

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Intel target for macOS Universal 2
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # -------------------------------------------------------------
      # Automated Verification: Clippy Linter & Test Suite
      # -------------------------------------------------------------
      - name: Run Cargo Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --target ${{ matrix.target }}

      # -------------------------------------------------------------
      # Compile Release Binaries
      # -------------------------------------------------------------
      - name: Cargo build (Release)
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Cargo build macOS Universal 2 (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output tailorbird target/aarch64-apple-darwin/release/tailorbird target/x86_64-apple-darwin/release/tailorbird
          lipo -info tailorbird

      # -------------------------------------------------------------
      # 1. Windows: Build & Upload Inno Setup Installer only
      # -------------------------------------------------------------
      - name: Build Windows Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary-name }} -Destination target/release/${{ matrix.binary-name }}
          New-Item -ItemType Directory -Force dist
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { "iscc" } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe" }
          & $iscc installer/tailorbird.iss

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Tailorbird-Setup-v0.2.1.exe
          path: dist/Tailorbird-Setup-v0.2.1.exe

      # -------------------------------------------------------------
      # 2. macOS: Universal 2 Bundle, Sign & Notarize DMG
      # -------------------------------------------------------------
      - name: Build macOS Application Bundle, Sign & Notarize DMG
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p Tailorbird.iconset
          sips -z 16 16     src/assets/icon.png --out Tailorbird.iconset/icon_16x16.png
          sips -z 32 32     src/assets/icon.png --out Tailorbird.iconset/icon_16x16@2x.png
          sips -z 32 32     src/assets/icon.png --out Tailorbird.iconset/icon_32x32.png
          sips -z 64 64     src/assets/icon.png --out Tailorbird.iconset/icon_32x32@2x.png
          sips -z 128 128   src/assets/icon.png --out Tailorbird.iconset/icon_128x128.png
          sips -z 256 256   src/assets/icon.png --out Tailorbird.iconset/icon_128x128@2x.png
          sips -z 256 256   src/assets/icon.png --out Tailorbird.iconset/icon_256x256.png
          sips -z 512 512   src/assets/icon.png --out Tailorbird.iconset/icon_256x256@2x.png
          sips -z 512 512   src/assets/icon.png --out Tailorbird.iconset/icon_512x512.png
          iconutil -c icns Tailorbird.iconset -o icon.icns

          mkdir -p Tailorbird.app/Contents/MacOS
          mkdir -p Tailorbird.app/Contents/Resources
          cp tailorbird Tailorbird.app/Contents/MacOS/
          chmod +x Tailorbird.app/Contents/MacOS/tailorbird
          cp installer/macos/Info.plist Tailorbird.app/Contents/
          cp icon.icns Tailorbird.app/Contents/Resources/

          # Setup Keychain and import Developer ID Certificate if configured
          SIGNING_IDENTITY=""
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE_PWD" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PWD="build_temp_password"

            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | awk -F '"' '{print $2}')
            echo "Signing Identity: $SIGNING_IDENTITY"

            # Sign the .app bundle with Hardened Runtime, Entitlements, and Timestamp
            codesign --force --deep --options runtime --timestamp \
              --entitlements installer/macos/Tailorbird.entitlements \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              Tailorbird.app
          else
            echo "No signing certificate found in secrets. Falling back to ad-hoc signing."
            codesign --force --deep --sign - Tailorbird.app
          fi

          # Create DMG installer with Applications drag-and-drop link, Uninstaller, and README guide
          mkdir -p dmg_root
          cp -R Tailorbird.app dmg_root/
          ln -s /Applications dmg_root/Applications
          cp installer/macos/Uninstall.command dmg_root/
          chmod +x dmg_root/Uninstall.command
          cp installer/macos/README.txt dmg_root/
          hdiutil create -volname "Tailorbird" -srcfolder dmg_root -ov -format UDZO Tailorbird-macOS.dmg

          # Sign and Notarize DMG if credentials are present
          if [ -n "$SIGNING_IDENTITY" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "Signing DMG container..."
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" Tailorbird-macOS.dmg

            echo "Preparing App Store Connect API Key for notarization..."
            API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
            if echo "$APPLE_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              echo "$APPLE_API_KEY" > "$API_KEY_PATH"
            else
              echo "$APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH" 2>/dev/null || echo "$APPLE_API_KEY" > "$API_KEY_PATH"
            fi

            echo "Submitting DMG to Apple Notary Service..."
            xcrun notarytool submit Tailorbird-macOS.dmg \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait

            echo "Stapling notarization ticket to DMG..."
            xcrun stapler staple Tailorbird-macOS.dmg

            # Verify notarization assessment
            spctl --assess -vv --type install Tailorbird-macOS.dmg || true
          fi

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Tailorbird-macOS.dmg
          path: Tailorbird-macOS.dmg

      # -------------------------------------------------------------
      # 3. Linux: Bundle binary with instructions, desktop entry & installer
      # -------------------------------------------------------------
      - name: Package Linux release bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p tailorbird-linux-x86_64
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} tailorbird-linux-x86_64/tailorbird
          chmod +x tailorbird-linux-x86_64/tailorbird
          cp installer/linux/README.txt tailorbird-linux-x86_64/README.txt
          cp installer/linux/tailorbird.desktop tailorbird-linux-x86_64/tailorbird.desktop
          cp installer/linux/install.sh tailorbird-linux-x86_64/install.sh
          chmod +x tailorbird-linux-x86_64/install.sh
          cp src/assets/icon.png tailorbird-linux-x86_64/icon.png
          tar -czf tailorbird-linux-x86_64.tar.gz tailorbird-linux-x86_64

      - name: Upload Linux Binary Bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tailorbird-linux-x86_64.tar.gz
          path: tailorbird-linux-x86_64.tar.gz

      # -------------------------------------------------------------
      # Release Draft Publishing
      # -------------------------------------------------------------
      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tailorbird-Setup-v0.2.1.exe
            Tailorbird-macOS.dmg
            tailorbird-linux-x86_64.tar.gz
          draft: true
          generate_release_notes: true
