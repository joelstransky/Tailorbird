[package]
name = "tailorbird"
version = "0.1.0"
edition = "2021"
description = "A dual-pane specialized job-search desktop browser built with Rust, Tao, and Wry"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
pdf-extract = "0.12"
ureq = "2.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

