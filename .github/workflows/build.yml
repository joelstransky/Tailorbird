name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            target: x86_64-pc-windows-msvc
            binary-name: tailorbird.exe
            asset-name: tailorbird-windows-x86_64.exe
          - os: ubuntu-22.04
            os-name: Linux (Ubuntu x86_64)
            target: x86_64-unknown-linux-gnu
            binary-name: tailorbird
            asset-name: tailorbird-linux-x86_64
          - os: macos-latest
            os-name: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            binary-name: tailorbird
            asset-name: tailorbird-macos-arm64
          - os: macos-latest
            os-name: macOS (Intel)
            target: x86_64-apple-darwin
            binary-name: tailorbird
            asset-name: tailorbird-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo build (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary-name }} -Destination ${{ matrix.asset-name }}

      - name: Build Windows Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary-name }} -Destination target/release/${{ matrix.binary-name }}
          New-Item -ItemType Directory -Force dist
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { "iscc" } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe" }
          & $iscc installer/tailorbird.iss

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Tailorbird-Setup-v0.1.0.exe
          path: dist/Tailorbird-Setup-v0.1.0.exe

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} ${{ matrix.asset-name }}
          chmod +x ${{ matrix.asset-name }}

      - name: Build macOS Application Bundle and DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p Tailorbird.iconset
          sips -z 16 16     src/assets/icon.png --out Tailorbird.iconset/icon_16x16.png
          sips -z 32 32     src/assets/icon.png --out Tailorbird.iconset/icon_16x16@2x.png
          sips -z 32 32     src/assets/icon.png --out Tailorbird.iconset/icon_32x32.png
          sips -z 64 64     src/assets/icon.png --out Tailorbird.iconset/icon_32x32@2x.png
          sips -z 128 128   src/assets/icon.png --out Tailorbird.iconset/icon_128x128.png
          sips -z 256 256   src/assets/icon.png --out Tailorbird.iconset/icon_128x128@2x.png
          sips -z 256 256   src/assets/icon.png --out Tailorbird.iconset/icon_256x256.png
          sips -z 512 512   src/assets/icon.png --out Tailorbird.iconset/icon_256x256@2x.png
          sips -z 512 512   src/assets/icon.png --out Tailorbird.iconset/icon_512x512.png
          iconutil -c icns Tailorbird.iconset -o icon.icns

          mkdir -p Tailorbird.app/Contents/MacOS
          mkdir -p Tailorbird.app/Contents/Resources
          cp target/${{ matrix.target }}/release/tailorbird Tailorbird.app/Contents/MacOS/
          chmod +x Tailorbird.app/Contents/MacOS/tailorbird
          cp installer/macos/Info.plist Tailorbird.app/Contents/
          cp icon.icns Tailorbird.app/Contents/Resources/

          # Ad-hoc code sign the bundle
          codesign --force --deep --sign - Tailorbird.app

          # Create DMG installer with Applications link
          mkdir -p dmg_root
          cp -R Tailorbird.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Tailorbird" -srcfolder dmg_root -ov -format UDZO ${{ matrix.asset-name }}.dmg

          # Create zip of .app
          ditto -c -k --keepParent Tailorbird.app ${{ matrix.asset-name }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset-name }}
          path: ${{ matrix.asset-name }}

      - name: Upload macOS DMG artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset-name }}.dmg
          path: ${{ matrix.asset-name }}.dmg

      - name: Upload macOS Zip artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset-name }}.zip
          path: ${{ matrix.asset-name }}.zip

      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset-name }}
            dist/Tailorbird-Setup-v0.1.0.exe
            *.dmg
            *.zip
          draft: true
          generate_release_notes: true
