name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            target: x86_64-pc-windows-msvc
            binary-name: tailorbird.exe
          - os: macos-latest
            os-name: macOS (Universal 2)
            target: aarch64-apple-darwin
            binary-name: tailorbird
          - os: ubuntu-22.04
            os-name: Linux (Ubuntu x86_64)
            target: x86_64-unknown-linux-gnu
            binary-name: tailorbird

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Intel target for macOS Universal 2
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # -------------------------------------------------------------
      # Automated Verification: Clippy Linter & Test Suite
      # -------------------------------------------------------------
      - name: Run Cargo Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --target ${{ matrix.target }}

      # -------------------------------------------------------------
      # Compile Release Binaries
      # -------------------------------------------------------------
      - name: Cargo build (Release)
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Cargo build macOS Universal 2 (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output tailorbird target/aarch64-apple-darwin/release/tailorbird target/x86_64-apple-darwin/release/tailorbird
          lipo -info tailorbird

      # -------------------------------------------------------------
      # 1. Windows: Build & Upload Inno Setup Installer only
      # -------------------------------------------------------------
      - name: Build Windows Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary-name }} -Destination target/release/${{ matrix.binary-name }}
          New-Item -ItemType Directory -Force dist
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { "iscc" } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe" }
          & $iscc installer/tailorbird.iss

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Tailorbird-Setup-v0.1.0.exe
          path: dist/Tailorbird-Setup-v0.1.0.exe

      # -------------------------------------------------------------
      # 2. macOS: Universal 2 Bundle, Sign & Upload DMG only
      # -------------------------------------------------------------
      - name: Build macOS Application Bundle and DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p Tailorbird.iconset
          sips -z 16 16     src/assets/icon.png --out Tailorbird.iconset/icon_16x16.png
          sips -z 32 32     src/assets/icon.png --out Tailorbird.iconset/icon_16x16@2x.png
          sips -z 32 32     src/assets/icon.png --out Tailorbird.iconset/icon_32x32.png
          sips -z 64 64     src/assets/icon.png --out Tailorbird.iconset/icon_32x32@2x.png
          sips -z 128 128   src/assets/icon.png --out Tailorbird.iconset/icon_128x128.png
          sips -z 256 256   src/assets/icon.png --out Tailorbird.iconset/icon_128x128@2x.png
          sips -z 256 256   src/assets/icon.png --out Tailorbird.iconset/icon_256x256.png
          sips -z 512 512   src/assets/icon.png --out Tailorbird.iconset/icon_256x256@2x.png
          sips -z 512 512   src/assets/icon.png --out Tailorbird.iconset/icon_512x512.png
          iconutil -c icns Tailorbird.iconset -o icon.icns

          mkdir -p Tailorbird.app/Contents/MacOS
          mkdir -p Tailorbird.app/Contents/Resources
          cp tailorbird Tailorbird.app/Contents/MacOS/
          chmod +x Tailorbird.app/Contents/MacOS/tailorbird
          cp installer/macos/Info.plist Tailorbird.app/Contents/
          cp icon.icns Tailorbird.app/Contents/Resources/

          # Ad-hoc code sign the Universal bundle
          codesign --force --deep --sign - Tailorbird.app

          # Create DMG installer with Applications drag-and-drop link
          mkdir -p dmg_root
          cp -R Tailorbird.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Tailorbird" -srcfolder dmg_root -ov -format UDZO Tailorbird-macOS.dmg

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Tailorbird-macOS.dmg
          path: Tailorbird-macOS.dmg

      # -------------------------------------------------------------
      # 3. Linux: Upload binary
      # -------------------------------------------------------------
      - name: Stage Linux binary
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} tailorbird-linux-x86_64
          chmod +x tailorbird-linux-x86_64

      - name: Upload Linux Binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tailorbird-linux-x86_64
          path: tailorbird-linux-x86_64

      # -------------------------------------------------------------
      # Release Draft Publishing
      # -------------------------------------------------------------
      - name: Create or update draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tailorbird-Setup-v0.1.0.exe
            Tailorbird-macOS.dmg
            tailorbird-linux-x86_64
          draft: true
          generate_release_notes: true
