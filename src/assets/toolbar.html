<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailorbird Toolbar</title>
  <style>
    :root {
      --tab-bar-bg: #0E1118;
      --nav-bar-bg: #12151D;
      --border-color: #1E222D;
      --active-tab-bg: #181C28;
      --tab-border: #232836;
      --omnibar-bg: #181B26;
      --omnibar-border: #232836;
      --record-btn-bg: #1E2433;
      --record-btn-border: #334155;
      --text: #94A3B8;
      --text-bright: #E2E8F0;
      --text-muted: #64748B;
      --accent: #818CF8;
      --accent-cyan: #38BDF8;
      --accent-green: #10B981;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--nav-bar-bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 11px;
      height: 78px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* 1. Browser Tab Bar (36px, fill #0E1118, stroke #1E222D, padding 0 10px, gap 6px) */
    .tab-bar {
      height: 36px;
      background: var(--tab-bar-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: flex-end;
      padding: 0 10px;
      gap: 6px;
      overflow: hidden;
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      height: 100%;
    }

    .tab-list::-webkit-scrollbar {
      display: none;
    }

    .tab-chip {
      height: 30px;
      max-width: 240px;
      min-width: 120px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 6px 6px 0 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .tab-chip:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-bright);
    }

    .tab-chip.active {
      background: var(--active-tab-bg);
      color: var(--text-bright);
      border-color: var(--tab-border);
      z-index: 2;
    }

    .tab-icon {
      width: 13px;
      height: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent-cyan);
    }

    .tab-chip.active .tab-icon {
      color: var(--accent-cyan);
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .tab-close {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .tab-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #EF4444;
    }

    .new-tab-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
    }

    /* 2. Navigation Toolbar (42px, fill #12151D, stroke #1E222D, padding 0 16px, gap 12px) */
    .nav-toolbar {
      height: 42px;
      background: var(--nav-bar-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .nav-history-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .nav-icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-bright);
    }

    .nav-icon-btn:active {
      transform: scale(0.92);
    }

    /* Omnibar Input (height 30px, fill #181B26, cornerRadius 6px, stroke #232836, padding 0 10px) */
    .omnibar-wrap {
      flex: 1;
      height: 30px;
      background: var(--omnibar-bg);
      border: 1px solid var(--omnibar-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .omnibar-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .omnibar-lock-icon {
      width: 12px;
      height: 12px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #urlInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-bright);
      font-size: 11px;
      font-family: var(--font-ui);
    }

    #urlInput::placeholder {
      color: var(--text-muted);
    }

    /* Record Prospect Button (height 28px, fill #1E2433, cornerRadius 6px, stroke #334155, gap 6px, padding 0 10px) */
    .record-prospect-btn {
      height: 28px;
      background: var(--record-btn-bg);
      border: 1px solid var(--record-btn-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      color: var(--text-bright);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .record-prospect-btn:hover {
      background: #252D3F;
      border-color: #475569;
    }

    .record-prospect-btn:active {
      transform: scale(0.96);
    }

    .record-prospect-icon {
      width: 13px;
      height: 13px;
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- Browser Tab Bar (Pen LdQOH) -->
  <div class="tab-bar">
    <div class="tab-list" id="tabList">
      <!-- Dynamically populated tab chips -->
    </div>
    <button class="new-tab-btn" id="btnNewTab" title="New Tab" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation Toolbar (Pen U7fO6) -->
  <div class="nav-toolbar">
    <div class="nav-history-buttons">
      <button class="nav-icon-btn" id="btnBack" title="Back" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <button class="nav-icon-btn" id="btnForward" title="Forward" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      <button class="nav-icon-btn" id="btnReload" title="Reload" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>

    <!-- Omnibar Input (Pen yB9Fn) -->
    <div class="omnibar-wrap">
      <span class="omnibar-lock-icon" id="omniLock">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <input type="text" id="urlInput" placeholder="Search or type URL..." value="local://mock">
    </div>

    <!-- Record Prospect Action (Pen wJ3hT) -->
    <button class="record-prospect-btn" id="btnRecordProspect" title="Record active page listing to prospects sheet" type="button">
      <svg class="record-prospect-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        <line x1="12" y1="7" x2="12" y2="13"></line>
        <line x1="9" y1="10" x2="15" y2="10"></line>
      </svg>
      <span>Record Prospect</span>
    </button>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const tabList = document.getElementById('tabList');
    const btnNewTab = document.getElementById('btnNewTab');
    const omniLock = document.getElementById('omniLock');

    let currentTabs = [];
    let currentActiveId = null;

    function sendIpc(action, payload = {}) {
      if (window.ipc && typeof window.ipc.postMessage === 'function') {
        window.ipc.postMessage(JSON.stringify({ action, ...payload }));
      }
    }

    // Set and render all open tabs
    window.setTabs = function(tabs, activeId) {
      currentTabs = tabs || [];
      currentActiveId = activeId;
      renderTabs();
    };

    function renderTabs() {
      tabList.innerHTML = '';

      currentTabs.forEach(tab => {
        const chip = document.createElement('div');
        const isActive = (tab.id === currentActiveId);
        chip.className = 'tab-chip' + (isActive ? ' active' : '');
        
        let displayTitle = (tab.title || '').trim();
        if (!displayTitle || displayTitle === 'New Tab') {
          if (tab.url === 'local://mock') {
            displayTitle = 'Mock ATS Form';
          } else if (tab.url === 'local://hitlist') {
            displayTitle = 'Hit List';
          } else if (tab.url === 'local://settings') {
            displayTitle = 'Settings';
          } else if (tab.url) {
            try {
              displayTitle = new URL(tab.url).hostname;
            } catch (_) {
              displayTitle = tab.url;
            }
          } else {
            displayTitle = 'New Tab';
          }
        }
        chip.title = `${displayTitle}\n${tab.url || ''}`;

        // SVG icon selection based on url
        let iconSvg = '';
        if (tab.url === 'local://hitlist') {
          iconSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`;
        } else if (tab.url === 'local://settings') {
          iconSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
        } else if ((tab.url || '').includes('google.com/search')) {
          iconSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
        } else {
          iconSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
        }

        chip.innerHTML = `
          <span class="tab-icon">${iconSvg}</span>
          <span class="tab-title">${escapeHtml(displayTitle)}</span>
          <span class="tab-close" title="Close tab" data-id="${tab.id}">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </span>
        `;

        chip.addEventListener('click', (e) => {
          if (e.target.closest('.tab-close')) {
            e.stopPropagation();
            sendIpc('CLOSE_TAB', { id: tab.id });
          } else {
            if (tab.id !== currentActiveId) {
              sendIpc('SWITCH_TAB', { id: tab.id });
            }
          }
        });

        tabList.appendChild(chip);
      });

      const activeEl = tabList.querySelector('.tab-chip.active');
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        switch (m) {
          case '&': return '&amp;';
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '"': return '&quot;';
          case "'": return '&#039;';
          default: return m;
        }
      });
    }

    window.setUrl = function(url) {
      if (url) {
        urlInput.value = url;
      }
    };

    window.setPrimaryColor = function(color) {
      if (color) {
        document.documentElement.style.setProperty('--accent', color);
      }
    };

    if (window.__INITIAL_PRIMARY_COLOR__) {
      window.setPrimaryColor(window.__INITIAL_PRIMARY_COLOR__);
    }

    function navigate() {
      let url = urlInput.value.trim();
      if (!url) return;
      sendIpc('NAVIGATE', { url: url });
    }

    btnNewTab.addEventListener('click', () => {
      sendIpc('NEW_TAB');
    });

    document.getElementById('btnBack').addEventListener('click', () => sendIpc('BACK'));
    document.getElementById('btnForward').addEventListener('click', () => sendIpc('FORWARD'));
    document.getElementById('btnReload').addEventListener('click', () => sendIpc('RELOAD'));
    document.getElementById('btnRecordProspect').addEventListener('click', () => {
      sendIpc('SCRAPE_CURRENT_PAGE');
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate();
    });
  </script>
</body>
</html>
