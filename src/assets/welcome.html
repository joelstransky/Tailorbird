<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Tailorbird</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0B0D13;
      --card-bg: #131726;
      --card-border: #22283C;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --text-sub: #CBD5E1;
      --accent-purple: #818CF8;
      --accent-blue: #38BDF8;
      --footer-text: #64748B;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Subtle atmospheric radial glow in background */
    .bg-glow {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 680px;
      height: 480px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Content Area */
    .welcome-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px 24px;
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    /* Brand Logo Block */
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo-emblem {
      width: 76px;
      height: 76px;
      background-color: transparent;
      border: none;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-emblem:hover {
      transform: translateY(-2px) scale(1.04);
    }

    .logo-emblem svg {
      width: 49px;
      height: 49px;
      color: #6366F1;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #F8FAFC;
    }

    /* Centered Content Frame */
    .content-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 640px;
    }

    /* Inspirational Message Group */
    .message-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 580px;
    }

    .message-body {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      text-align: center;
      transition: opacity 0.25s ease;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Test Form Callout Pill */
    .test-form-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .test-form-pill:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background-color: #171C2E;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .test-form-pill:active {
      transform: translateY(0);
    }

    .pill-text {
      font-size: 13px;
      color: var(--text-sub);
    }

    .pill-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-purple);
      transition: color 0.15s ease;
    }

    .test-form-pill:hover .pill-action {
      color: #9BA5FF;
    }

    .pill-action svg {
      transition: transform 0.2s ease;
    }

    .test-form-pill:hover .pill-action svg {
      transform: translateX(3px);
    }

    /* Sticky Footer */
    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: linear-gradient(to top, rgba(11, 13, 19, 0.95), rgba(11, 13, 19, 0.8) 70%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .footer-version-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--footer-text);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="bg-glow"></div>

  <!-- Main Container -->
  <main class="welcome-container">

    <!-- Tailorbird Logo & Brand Wordmark -->
    <div class="brand-block">
      <div class="logo-emblem">
        <svg width="49" height="49" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 7h.01"/>
          <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 18"/>
          <path d="m20 7 2 .5-2 .5"/>
          <path d="M10 18v3"/>
          <path d="M14 17.75V21"/>
          <path d="M7 18a6 6 0 0 0 3.84-10.61"/>
        </svg>
      </div>
      <h1 class="brand-title">Tailorbird</h1>
    </div>

    <!-- Center Content Frame -->
    <div class="content-frame">
      <!-- Message of Encouragement -->
      <div class="message-group">
        <p class="message-body" id="inspirationalBody">
          Every application is an opportunity. Take a breath, prepare your profile, and apply with confidence.
        </p>
      </div>

      <!-- Note about Test Form with Action Link -->
      <a href="local://mock" class="test-form-pill" id="btnTestForm" title="Open the Tailorbird Test Bench">
        <span class="pill-text">Want to test autofill or preview candidate data?</span>
        <span class="pill-action">
          Open Test Form
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </a>
    </div>

  </main>

  <!-- Sticky Footer -->
  <footer class="sticky-footer">
    <div class="footer-version-badge">
      <span class="version-text">v0.1.0</span>
    </div>
  </footer>

  <script>
    // 32 Encouraging statements for people feeling weary or discouraged by job hunting
    const INSPIRATIONAL_PHRASES = [
      "Every application is an opportunity. Take a breath, prepare your profile, and apply with confidence.",
      "Your worth is not defined by an automated rejection email. Keep going.",
      "You only need one 'yes' to change everything. Every application brings you closer.",
      "Be gentle with yourself today. Job hunting is a marathon, not a sprint.",
      "Rejection is often redirection toward a role that truly values your unique strengths.",
      "You have accomplished difficult things before, and you will get through this season too.",
      "Small daily steps lead to life-changing results. Celebrate showing up today.",
      "Remember that interviewers and hiring algorithms never see your full depth and brilliance.",
      "Your career is a lifelong story, and this is just one challenging chapter.",
      "Rest when you need to. Rest is productive and preserves your spark.",
      "The right team will be lucky to have your perspective, skills, and energy.",
      "Don't let silence from employers shake your belief in what you have built.",
      "You are learning, sharpening, and preparing for the role that will fit you best.",
      "It is completely normal to feel tired. Acknowledge your fatigue and be kind to yourself.",
      "One conversation can change your entire trajectory. Stay curious and open.",
      "Your skills didn't disappear just because the market is difficult right now.",
      "Keep your chin up. What is meant for you will not pass you by.",
      "Every 'no' is just data. Refine, recharge, and step forward again.",
      "You are more than your resume, your job title, or your employment status.",
      "Give yourself credit for the courage it takes to put yourself out there again and again.",
      "A quiet period is not a failure. Seeds grow underground before they sprout.",
      "You are more capable, resilient, and adaptable than you give yourself credit for.",
      "A company that passes on you simply didn't see what the right one will value most.",
      "Make time for fresh air, good food, and a clear mind today. You deserve care.",
      "Behind every successful hire was a long string of closed doors. Keep knocking.",
      "The right opportunity will recognize and appreciate what you bring to the table.",
      "Courage does not always roar. Sometimes it's the quiet voice saying 'I will try again tomorrow.'",
      "You are building resilience that will serve you for the rest of your career.",
      "It only takes one person to see your potential. Keep putting yourself out there.",
      "Be patient with the journey. Great things take time, and your effort will pay off.",
      "Breathe in, let go of the pressure, and trust the work you are putting in.",
      "You are worthy, you are capable, and your breakthrough is coming."
    ];

    const bodyEl = document.getElementById('inspirationalBody');

    function getRandomPhrase() {
      const randomIndex = Math.floor(Math.random() * INSPIRATIONAL_PHRASES.length);
      return INSPIRATIONAL_PHRASES[randomIndex];
    }

    function displayRandomPhrase() {
      if (!bodyEl) return;
      bodyEl.textContent = getRandomPhrase();
    }

    // Set initial phrase on load
    displayRandomPhrase();

    // IPC Link handling for Test Form
    const btnTestForm = document.getElementById('btnTestForm');
    if (btnTestForm) {
      btnTestForm.addEventListener('click', (e) => {
        e.preventDefault();
        if (window.ipc && typeof window.ipc.postMessage === 'function') {
          window.ipc.postMessage(JSON.stringify({ action: 'OPEN_NEW_TAB', url: 'local://mock' }));
        } else {
          window.location.href = 'local://mock';
        }
      });
    }
  </script>
</body>
</html>
